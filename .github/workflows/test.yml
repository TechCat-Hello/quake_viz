name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      SECRET_KEY: ci-test-secret-key
      # DEBUG=Falseにすると本番向けのSECURE_SSL_REDIRECT等が有効になり、
      # HTTPでアクセスするテストクライアントが全てHTTPSへの301リダイレクトを
      # 受け取ってしまい失敗するため、テスト実行時はTrueにする
      DEBUG: "True"
      DATABASE_URL: sqlite:///db.sqlite3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run migrations check
        run: python manage.py check

      - name: Run tests
        run: python manage.py test
