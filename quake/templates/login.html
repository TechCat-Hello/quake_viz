<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ログイン | 都道府県別 地震可視化アプリ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f4f4f9;
    }
    .login-container {
      background-color: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      width: 340px;
      text-align: center;
    }
    @media (min-width: 1024px) {
      .login-container {
        width: 600px;
        min-height: 600px;
      }
      .app-title {
        font-size: 2.5em;
      }
      .app-description {
        font-size: 1.15em;
      }
      h1 {
        font-size: 1.5em;
      }
    }
    .app-title {
      font-size: 1.5em;
      font-weight: bold;
      color: #2563eb;
      letter-spacing: 2px;
      margin-bottom: 14px;
      padding-bottom: 6px;
      text-shadow: 0 2px 8px rgba(56,189,248,0.15);
      border-bottom: 3px solid #38bdf8;
      display: inline-block;
    }
    .app-description {
      font-size: 0.98em;
      color: #444;
      margin-bottom: 22px;
      line-height: 1.6;
    }
    h1 {
      margin-bottom: 20px;
      font-size: 1.2em;
      color: #333;
    }
    label {
      display: block;
      margin: 10px 0 5px;
      text-align: left;
    }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 10px;
      margin: 5px 0 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .full-width-button {
      width: 100%;
      padding: 10px;
      font-size: 1em;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      display: block;
      text-align: center;
      text-decoration: none;
      margin-top: 20px;
    }
    .login-btn {
      background-color: #4CAF50;
      color: white;
    }
    .login-btn:hover {
      background-color: #45a049;
    }
    .signup-btn {
      background-color: #2196F3;
      color: white;
      margin-top: 10px;
    }
    .signup-btn:hover {
      background-color: #1976D2;
    }
    .forgot-password {
      margin-top: 10px;
      font-size: 14px;
    }
    .forgot-password a {
      color: #2196F3;
      text-decoration: underline;
    }
    .show-password {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      margin-top: 5px;
      margin-bottom: 15px;
      font-size: 15px;
      font-family: Arial, sans-serif;
    }
    .show-password input[type="checkbox"] {
      margin-right: 8px;
    }
    .show-password label {
      margin: 0;
      font-weight: normal;
      text-align: left;
    }
    .demo-account-box {
      margin-top: 20px;
      padding: 16px;
      background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%);
      border-radius: 8px;
      border: 1px solid #90caf9;
      box-shadow: 0 2px 8px rgba(33, 150, 243, 0.1);
    }
    .demo-account-box .demo-title {
      font-size: 1em;
      font-weight: 600;
      color: #1976d2;
      margin-bottom: 10px;
      text-align: center;
      letter-spacing: 0.5px;
    }
    .demo-account-box .demo-info {
      font-size: 0.9em;
      color: #424242;
      text-align: center;
      line-height: 1.8;
    }
    .demo-account-box .demo-credentials {
      font-family: 'Courier New', monospace;
      font-weight: 600;
      color: #1565c0;
    }
    @media (max-width: 600px) {
      body {
        align-items: flex-start;
        height: auto;
        min-height: 100vh;
      }
      .login-container {
        margin-top: 8px;
        padding: 8px;
        width: 98vw;
      }
      .app-title {
        font-size: 1em;
        margin-bottom: 6px;
        padding-bottom: 2px;
      }
      .app-description {
        font-size: 0.85em;
        margin-bottom: 10px;
        line-height: 1.3;
      }
      h1 {
        font-size: 1em;
        margin-bottom: 10px;
      }
      label {
        margin: 6px 0 2px;
        font-size: 0.95em;
      }
      input[type="text"], input[type="password"] {
        padding: 7px;
        font-size: 1em;
      }
      .full-width-button {
        padding: 10px 0;
        font-size: 1em;
      }
      .forgot-password {
        font-size: 12px;
        margin-top: 6px;
      }
      .show-password {
        font-size: 13px;
        margin-bottom: 8px;
      }
      .demo-account-box {
        margin-top: 12px;
        padding: 12px;
      }
      .demo-account-box .demo-title {
        font-size: 0.9em;
        margin-bottom: 8px;
      }
      .demo-account-box .demo-info {
        font-size: 0.8em;
        line-height: 1.6;
      }
    }
  </style>
  <script>
    function togglePassword() {
      var passwordField = document.getElementById('password');
      var checkbox = document.getElementById('show-password');
      if (checkbox.checked) {
        passwordField.type = 'text';
      } else {
        passwordField.type = 'password';
      }
    }
  </script>
</head>
<body>
  <div class="login-container">
    <div class="app-title">都道府県別 地震可視化アプリ</div>
    <div class="app-description">
      USGS（アメリカ地質調査所）の地震データを利用し、<br>
      日本全国の地震を都道府県ごとに地図と表で分かりやすく表示します。<br>
      検索したデータはCSVやExcelでダウンロード可能、検索履歴も自動保存されます。
    </div>
    <h1>ログイン</h1>
    <form method="post">
      {% csrf_token %}
      <label for="username">ユーザー名:</label>
      <input type="text" name="username" id="username" required><br>
      <label for="password">パスワード:</label>
      <input type="password" name="password" id="password" required><br>
      <div class="show-password">
        <input type="checkbox" id="show-password" onclick="togglePassword()">
        <label for="show-password">パスワードを表示する</label>
      </div>
      <div class="forgot-password">
        パスワードをお忘れですか？ <a href="{% url 'password_reset' %}">こちらへ</a>
      </div>
      <button type="submit" class="full-width-button login-btn">ログイン</button>
    </form>
    <div class="signup-link">
      <p>アカウントをお持ちでない方はこちら</p>
      <a href="{% url 'signup' %}" class="full-width-button signup-btn">新規登録</a>
    </div>
    
    <div class="demo-account-box">
      <div class="demo-title">デモアカウント</div>
      <div class="demo-info">
        お試しで利用される場合は、以下のアカウントでログインできます。<br>
        <strong>ユーザー名:</strong> <span class="demo-credentials">demo_user</span><br>
        <strong>パスワード:</strong> <span class="demo-credentials">Demo2025!</span>
      </div>
    </div>
  </div>
</body>
</html>
